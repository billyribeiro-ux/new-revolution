<text x="1038" y="655" font-size="13" fill="#a0a7ad">Risk disclosure follows in normal flow.</text>
<text x="1038" y="683" font-size="12" fill="#a0a7ad">No chart below 768 px. No fixed hero height.</text>
</g>
<g font-size="16">
<text x="40" y="755" font-weight="750">1 / Recognition first</text><text x="40" y="780">Reuse the real gold emblem, Montserrat</text><text x="40" y="804">headings and Sofia Sans copy.</text>
<text x="510" y="755" font-weight="750">2 / Useful information together</text><text x="510" y="780">State the interruption explicitly and put</text><text x="510" y="804">support directly beside the main actions.</text>
<text x="1015" y="755" font-weight="750">3 / Honest visual restraint</text><text x="1015" y="780">A static chart belongs in its own panel.</text><text x="1015" y="804">Amber status is independent of brand acid.</text>
<text x="40" y="860" font-weight="750">4 / Responsive acceptance</text><text x="40" y="885">320 px: zero overflow; long email wraps.</text><text x="40" y="909">1280 × 720: status, message, support</text><text x="40" y="933">and both actions fit in the first viewport.</text>
<text x="510" y="860" font-weight="750">5 / Interaction boundaries</text><text x="510" y="885">Native email link + explicit document retry.</text><text x="510" y="909">No countdown, fabricated build progress,</text><text x="510" y="933">notification form or live market claims.</text>
<text x="1015" y="860" font-weight="750">6 / Operational contract</text><text x="1015" y="885">Preserve 503, no-store and deployment</text><text x="1015" y="909">activation. No normal-site navigation</text><text x="1015" y="933">while the maintenance gate is active.</text>
</g>
</g>
</svg>
