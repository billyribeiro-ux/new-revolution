<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
<title id="title">Proposal: Revolution Trading Pros maintenance desk notice</title>
<desc id="desc">Annotated desktop and mobile wireframes. Logo and maintenance status at the top, an explicit maintenance heading and explanation, email support and retry actions, and a separate decorative market structure panel on desktop. Mobile removes the chart and places all essential information before the footer. This is a proposal, not an implemented screenshot.</desc>
<rect width="1440" height="1010" fill="#f3f2ed"/>
<g font-family="system-ui,sans-serif" fill="#11151a">
<text x="40" y="45" font-size="25" font-weight="750">PROPOSAL / THE DESK NOTICE</text>
<text x="40" y="72" font-size="15">Layout study only. Font rendering and final dimensions require implementation QA.</text>
<rect x="40" y="102" width="930" height="605" rx="5" fill="#0b0e12"/>
<g fill="#f4f5f0">
<text x="70" y="135" font-size="13">DESKTOP / 1280 × 720 reference</text>
<circle cx="88" cy="183" r="17" fill="#c5a059"/>
<text x="120" y="179" font-size="15" font-weight="800">REVOLUTION</text><text x="120" y="197" font-size="15" font-weight="800">TRADING PROS</text>
<rect x="728" y="166" width="205" height="34" rx="2" fill="#151a20" stroke="#77664a"/>
<circle cx="745" cy="183" r="4" fill="#dec3a1"/><text x="757" y="188" font-size="12" fill="#dec3a1">Maintenance in progress</text>
<path d="M70 220H940" stroke="#2b313a"/>
<text x="86" y="283" font-size="12" letter-spacing="1.3" fill="#a0a7ad">A NOTE FROM THE DESK</text>
<text x="86" y="340" font-size="47" font-weight="800">Platform</text><text x="86" y="390" font-size="47" font-weight="800">maintenance.</text>
<text x="86" y="433" font-size="17">The site is temporarily unavailable while</text><text x="86" y="459" font-size="17">maintenance is in progress.</text><text x="86" y="485" font-size="17" fill="#a0a7ad">Thank you for your patience.</text>
<rect x="86" y="518" width="155" height="45" rx="2" fill="#dcff65"/><text x="108" y="546" font-size="15" font-weight="750" fill="#11151a">Email support</text>
<rect x="255" y="518" width="170" height="45" rx="2" fill="none" stroke="#5a6067"/><text x="340" y="546" text-anchor="middle" font-size="15">Try this page again</text>
<text x="86" y="597" font-size="15" fill="#a0a7ad">support@revolutiontradingpros.com</text>
<rect x="571" y="267" width="341" height="305" fill="#151a20" stroke="#2b313a"/>
<text x="590" y="296" font-size="11" letter-spacing="1" fill="#a0a7ad">MARKET STRUCTURE / ILLUSTRATIVE</text>
<path d="M592 355H891 M592 405H891 M592 455H891" stroke="#2b313a"/>
<path d="M592 444L617 430 642 442 667 409 692 418 717 391 742 405 767 363 792 382 817 356 842 367 867 342 891 351" fill="none" stroke="#dcff65" stroke-width="2"/>
<text x="590" y="538" font-size="13" fill="#a0a7ad">Conceptual illustration · No live prices</text>
<path d="M70 632H940" stroke="#2b313a"/>
<text x="86" y="659" font-size="13" fill="#a0a7ad">Educational services. Trading involves substantial risk of loss.</text>
<text x="86" y="682" font-size="13" fill="#a0a7ad">Content is not financial advice.</text>
</g>
<rect x="1015" y="102" width="385" height="605" rx="5" fill="#0b0e12"/>
<g fill="#f4f5f0">
<text x="1038" y="135" font-size="13">MOBILE / 390 × 844 reference</text>
<circle cx="1057" cy="176" r="14" fill="#c5a059"/><text x="1082" y="181" font-size="13" font-weight="800">REVOLUTION TRADING PROS</text>
<path d="M1038 204H1378" stroke="#2b313a"/>
<circle cx="1043" cy="238" r="4" fill="#dec3a1"/><text x="1056" y="243" font-size="13" fill="#dec3a1">Maintenance in progress</text>
<text x="1038" y="305" font-size="36" font-weight="800">Platform</text><text x="1038" y="345" font-size="36" font-weight="800">maintenance.</text>
<text x="1038" y="389" font-size="16">The site is temporarily unavailable</text><text x="1038" y="414" font-size="16">while maintenance is in progress.</text><text x="1038" y="449" font-size="16" fill="#a0a7ad">Thank you for your patience.</text>
<rect x="1038" y="479" width="338" height="44" fill="#dcff65"/><text x="1152" y="507" font-size="15" fill="#11151a" font-weight="750">Email support</text>
<rect x="1038" y="535" width="338" height="44" fill="none" stroke="#5a6067"/><text x="1141" y="563" font-size="15">Try this page again</text>
